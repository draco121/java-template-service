# Runs once, in a NEW repository created with GitHub's "Use this template" button.
#
# GitHub template repositories copy files as they are; they can't fill in names.
# Cookiecutter can. So this workflow:
#   1. runs Cookiecutter on template/ with THIS repository's name and owner,
#   2. replaces the template with the generated service and commits it,
#   3. starts the service's CI, which builds it and calls the platform's security gate.
#
# In the template repository itself it does nothing.
name: bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # commit the generated service
  actions: write    # start the CI run afterwards

jobs:
  bootstrap:
    name: Turn the template into your service
    if: ${{ !github.event.repository.is_template && github.event.repository.name != 'java-template-service' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Is there a template to fill in?
        id: todo
        run: |
          if [ -f template/cookiecutter.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to do: this repository is already a service."
          fi

      - uses: actions/setup-python@v7
        if: steps.todo.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fill in the template with this repository's name
        if: steps.todo.outputs.run == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          DESCRIPTION: ${{ github.event.repository.description }}
        run: |
          pip install --quiet cookiecutter

          # "Coupon_Service" -> slug "coupon-service", name "Coupon Service"
          slug=$(printf '%s' "$REPO_NAME" | tr '[:upper:]_. ' '[:lower:]---' | tr -cd 'a-z0-9-' \
                 | sed -E 's/^[^a-z]+//; s/-+/-/g; s/-$//' | cut -c1-41)
          [ ${#slug} -ge 3 ] || slug="my-service"
          name=$(printf '%s' "$slug" | tr '-' ' ' | sed -E 's/(^| )([a-z])/\1\u\2/g')
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')

          args=(service_name="$name" service_slug="$slug" owner_team="$owner")
          clean_desc=$(printf '%s' "$DESCRIPTION" | tr -d '<>&"\\{}' | tr -s ' ' | cut -c1-140)
          if [ -n "$clean_desc" ]; then args+=(description="$clean_desc"); fi

          echo "Generating '$name' ($slug) for $owner"
          cookiecutter --no-input template --output-dir "$RUNNER_TEMP/out" "${args[@]}"
          echo "SLUG=$slug" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Replace the template with the generated service
        if: steps.todo.outputs.run == 'true'
        run: |
          gen="$RUNNER_TEMP/out/$SLUG"
          # The generated .github/workflows files are identical to the ones already here.
          # (GitHub doesn't let a workflow token rewrite workflow files, so we keep these.)
          rm -rf "$gen/.github"
          git rm -rq template README.md
          cp -a "$gen"/. .
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Bootstrap $NAME from java-template-service"
          git push
          echo "### $NAME is ready" >> "$GITHUB_STEP_SUMMARY"
          echo "The template was filled in with this repository's name and committed. CI starts next." >> "$GITHUB_STEP_SUMMARY"

      - name: Start CI on the new service
        if: steps.todo.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Commits pushed by a workflow don't trigger other workflows, so start CI explicitly.
        run: gh workflow run ci.yml --ref "${{ github.ref_name }}"
