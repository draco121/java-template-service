# CI for a service created from https://github.com/draco121/java-template-service
#
# Your team owns "build". The platform team owns the security gate: it lives in ONE
# central place, so every service gets the same rules (and the same fixes) automatically.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Is there a service to build?
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f pom.xml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No pom.xml yet: this is the template itself, or the bootstrap hasn't finished. Nothing to build."
          fi

  build:
    name: Build, test, check formatting
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: mvn verify (compile, tests, Spotless formatting check)
        run: mvn -B verify

  security-gate:
    name: Platform
    needs: build
    uses: draco121/platform-engineering-workshop/.github/workflows/platform-gates.yml@main
